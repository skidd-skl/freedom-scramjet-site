<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Freedom</title>
  <script src="https://jsdelivr.net"></script>
  <style>
    body { margin: 0; font-family: sans-serif; display: flex; flex-direction: column; height: 100vh; }
    #bar { display: flex; padding: 10px; background: #111; gap: 8px; }
    input { flex: 1; padding: 10px; font-size: 16px; border-radius: 6px; border: none; }
    button { padding: 10px 16px; font-size: 16px; border-radius: 6px; border: none; cursor: pointer; }
    #status { background: #222; color: #0f0; padding: 6px 10px; font-size: 13px; font-family: monospace; }
    iframe { flex: 1; border: none; width: 100%; }
  </style>
</head>
<body>
  <div id="bar">
    <input id="url-input" type="url" placeholder="https://example.com" />
    <button id="go-btn">Go</button>
  </div>
  <div id="status">Starting...</div>
  <iframe id="proxy-frame"></iframe>

  <script type="module">
    import { BareMuxConnection } from "https://jsdelivr.net";

    const status = document.getElementById("status");
    const basePath = location.pathname.replace(/\/[^/]*$/, "/");

    try {
      status.textContent = "1/3 Loading Scramjet...";
      const { ScramjetController } = $scramjetLoadController();
      const scramjet = new ScramjetController({
        prefix: basePath + "scramjet/",
        files: {
          wasm: "https://jsdelivr.net",
          all: "https://jsdelivr.net",
          sync: "https://jsdelivr.net",
        },
      });
      await scramjet.init();

      status.textContent = "2/3 Registering Service Worker...";
      await navigator.serviceWorker.register("./sw.js", { scope: basePath });
      await navigator.serviceWorker.ready;

      status.textContent = "3/3 Connecting to Wisp...";
      const connection = new BareMuxConnection("./worker.js");
      await connection.setTransport("https://jsdelivr.net", [
        { wisp: "wss://anura.pro/" }
      ]);

      status.textContent = "Ready!";

      function navigate() {
        let url = document.getElementById("url-input").value.trim();
        if (!url) return;
        if (!url.startsWith("http://") && !url.startsWith("https://")) {
          url = "https://" + url;
        }
        document.getElementById("proxy-frame").src = scramjet.encodeUrl(url);
      }

      document.getElementById("go-btn").addEventListener("click", navigate);
      document.getElementById("url-input").addEventListener("keydown", (e) => {
        if (e.key === "Enter") navigate();
      });
    } catch (err) {
      status.style.color = "#f55";
      status.textContent = "Error: " + err.message;
    }
  </script>
</body>
</html>
